##############################################################################
# Build & Sign APK — SecuDash
#
# Triggers
# --------
#   • Every push to main / master
#   • Every pull request targeting main / master
#   • Manual trigger (workflow_dispatch)
#
# Secrets required (configure in Settings → Secrets and variables → Actions)
# --------------------------------------------------------------------------
#   KEYSTORE_BASE64      Base-64-encoded release keystore (.jks / .keystore)
#   KEYSTORE_PASSWORD    Password for the keystore
#   KEY_ALIAS            Alias of the signing key inside the keystore
#   KEY_PASSWORD         Password for the signing key
#
# How to create and encode a keystore
# ------------------------------------
#   keytool -genkey -v \
#     -keystore release.keystore \
#     -alias secudash \
#     -keyalg RSA -keysize 2048 \
#     -validity 10000 \
#     -storepass YOUR_STORE_PASS \
#     -keypass  YOUR_KEY_PASS \
#     -dname "CN=SecuDash, OU=Mobile, O=BFoxNet, L=City, S=State, C=US"
#
#   base64 -w 0 release.keystore > release_keystore_b64.txt
#   # Paste the contents of release_keystore_b64.txt into the KEYSTORE_BASE64 secret.
##############################################################################

name: Build and Sign APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Java (required by Gradle) ───────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Cache Gradle packages ───────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Make Gradle wrapper executable ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 5. Build unsigned release APK ─────────────────────────────────────
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # ── 6. Decode keystore from secret ────────────────────────────────────
      #
      # The keystore is stored as a Base-64 string in the KEYSTORE_BASE64
      # secret.  We decode it to a temporary file and sign the APK with
      # apksigner (bundled with the Android SDK build-tools).
      #
      # If the KEYSTORE_BASE64 secret is not set the signing step is skipped
      # and the unsigned APK is uploaded instead (useful for fork PRs).
      # ──────────────────────────────────────────────────────────────────────
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      # ── 7. Sign APK ───────────────────────────────────────────────────────
      - name: Sign APK with apksigner
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          # Locate the unsigned APK produced by Gradle
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SIGNED_APK="${UNSIGNED_APK//-unsigned/}"

          # Sign with apksigner from the latest installed build-tools
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # Verify signature
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      # ── 8. Locate unsigned APK when secrets not set ───────────────────────
      - name: Locate unsigned APK (no secrets)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "SIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

      # ── 9. Upload APK as workflow artifact ────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: secudash-release-apk
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 14
